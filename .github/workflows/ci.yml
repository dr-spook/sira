# Intégration continue : vérifie chaque PR vers main et chaque push sur main.
# content-source/ n'est pas versionné : « content --check » le signale et réussit (voulu).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Une nouvelle exécution sur la même branche annule la précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    name: lint, test, build, contenu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint et types
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Contenu
        run: npm run content -- --check
